[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-spatial-deconvolution"
version = "0.1.0"
description = "TRACE graph variational autoencoder for spatial transcriptomics deconvolution"
requires-python = ">=3.10"

[project.scripts]
trace-train = "trace_model.train:main"

[tool.setuptools.packages.find]
where = ["src"]
